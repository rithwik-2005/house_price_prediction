<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; text-align: center; }
        .box {
            background: white;
            padding: 30px;
            width: 350px;
            margin: auto;
            margin-top: 40px;
            border-radius: 5px;
        }
        a {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="box">
    {% if prediction %}
        <h2>Predicted House Price</h2>
        <h3>₹ {{ prediction }}</h3>
    {% else %}
        <h3>{{ error }}</h3>
    {% endif %}

    <a href="/">Predict Again</a>
</div>

</body>
</html>
