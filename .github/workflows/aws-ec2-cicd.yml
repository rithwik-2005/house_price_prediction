name: CI/CD to AWS EC2 using Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Login to Docker Hub
    - name: Docker Hub Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    #  Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/house-price-app:latest .

    #  Push Image to Docker Hub
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/house-price-app:latest

    #  Deploy to AWS EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop house-price-app || true
          docker rm house-price-app || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/house-price-app:latest
          docker run -d \
            --name house-price-app \
            -p 80:5000 \
            ${{ secrets.DOCKER_USERNAME }}/house-price-app:latest
